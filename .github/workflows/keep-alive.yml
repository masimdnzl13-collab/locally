name: Supabase keep-alive

# Supabase ücretsiz planı 7 gün hareketsiz kalan projeyi duraklatır.
# /api/health her çağrıda Supabase'e sorgu attığı için günde bir istek yeterli.
# URL repository secret'ından gelir: Settings → Secrets and variables → Actions →
# HEALTH_CHECK_URL = https://<production-domain>/api/health
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          if [ -z "$HEALTH_CHECK_URL" ]; then
            echo "::error::HEALTH_CHECK_URL secret tanımlı değil"
            exit 1
          fi
          body=$(curl --silent --show-error --fail-with-body --retry 3 --retry-delay 10 --max-time 30 "$HEALTH_CHECK_URL")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
