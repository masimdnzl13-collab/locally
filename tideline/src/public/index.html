<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Brain Admin</title><style>body{font:16px system-ui;margin:0;background:#f7f7f5;color:#18251d}header{padding:20px;background:#173d2b;color:#fff}main{max-width:1100px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{border:0;padding:9px 12px;border-radius:5px;background:#d9ad50;color:#18251d;cursor:pointer}section{background:#fff;border:1px solid #ddd;border-radius:8px;padding:18px;margin:12px 0}textarea,input{width:100%;box-sizing:border-box;padding:8px;margin:5px 0}pre{white-space:pre-wrap;overflow:auto;background:#17221b;color:#dff5e6;padding:12px;border-radius:6px}</style><body><header><h1>Restaurant Brain</h1><small>Demo identity is prefilled. Production authentication should set these context headers after session verification.</small></header><main><section><label>User ID <input id="user" value="demo-owner"></label><label>Restaurant ID <input id="restaurant" value="demo-restaurant"></label></section><nav id="nav"></nav><section><h2 id="title">Restaurant context</h2><p id="hint">View live, tenant-isolated context used by the future receptionist.</p><textarea id="data" rows="14" placeholder="JSON configuration"></textarea><p><button id="load">Load</button> <button id="save">Save current JSON</button></p><pre id="out"></pre></section></main><script type="module">const sections={restaurant:['/api/restaurant','PATCH'],hours:['/api/hours','POST'],menu:['/api/items','POST'],faqs:['/api/faqs','POST'],policies:['/api/policies','POST'],parking:['/api/settings/parking','PUT'],specials:['/api/specials','POST'],'reservations/settings':['/api/settings/reservations','PUT'],'ai/settings':['/api/settings/ai','PUT'],season:['/api/settings/season','PUT']};let selected='restaurant';const h=()=>({'x-user-id':user.value,'x-restaurant-id':restaurant.value,'content-type':'application/json'});function choose(n){selected=n;title.textContent=n;load.click()}for(const n of Object.keys(sections)){const b=document.createElement('button');b.textContent='/'+n;b.onclick=()=>choose(n);nav.append(b)}async function request(method,url,body){let r=await fetch(url,{method,headers:h(),body:body?JSON.stringify(body):undefined});let x=await r.json();if(!r.ok)throw Error(x.error);return x}load.onclick=async()=>{try{let s=sections[selected],x=await request('GET',s[0]);data.value=JSON.stringify(x,null,2);out.textContent='Loaded.'}catch(e){out.textContent=e}};save.onclick=async()=>{try{let s=sections[selected],method=s[1],x=await request(method,s[0],JSON.parse(data.value));out.textContent=JSON.stringify(x,null,2)}catch(e){out.textContent=e}};load.click();</script></body></html>
