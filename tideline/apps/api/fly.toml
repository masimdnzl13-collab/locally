# Fly.io — Tideline API + worker (bkz. DEPLOYMENT.md, "Option A: Fly.io").
# Uygulama adı Fly'da global olarak benzersiz olmalı; deploy/fly-deploy.sh
# FLY_API_APP ile başka bir ad verilirse `--app` ile ezilir.
app = "locally-tideline-api"
primary_region = "iad"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "3000"
  LOG_LEVEL = "info"
  TELEPHONY_MODE = "twilio"
  TWILIO_VALIDATE_SIGNATURES = "true"
  STT_PROVIDER = "deepgram"
  TTS_PROVIDER = "deepgram"
  AI_PROVIDER = "anthropic"

[processes]
  app = "node dist/server.js"
  worker = "node dist/worker.js"

# Tek makine yerinde değiştirilir: eski API durup Postgres advisory kilidini
# bırakmadan yenisi açılamaz (src/database/singleton-lock.ts). Deploy sırasında
# süren aramalar düşer; mesai dışında deploy edin.
[deploy]
  strategy = "rolling"
  max_unavailable = 1

[http_service]
  processes = ["app"]
  internal_port = 3000
  force_https = true
  # Durmuş makine = kaçan arama. Canlı çağrı durumu süreç belleğinde olduğu
  # için "app" TEK makine kalmalı: `fly scale count app=1 worker=1`.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  # Her arama bir Twilio media WebSocket'i (30 dk'ya kadar) tutar; Fly'ın
  # varsayılan 25 bağlantı sınırı birkaç eşzamanlı aramada dolar.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    method = "GET"
    path = "/ready"
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  processes = ["app", "worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
