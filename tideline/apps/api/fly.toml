# Fly.io config for the Tideline API + worker (one Fly app, two process groups).
# See DEPLOYMENT.md "Option A: Fly.io". Deploy from this directory: `fly deploy`.
#
# App names are global on Fly. If "tideline-api" is taken, create another name and
# deploy with `fly deploy -a <name>` (or change `app` below).
app = "tideline-api"
primary_region = "iad"   # US East: close to Twilio's media edge and East Coast restaurants

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "node dist/server.js"
  worker = "node dist/worker.js"

# Only non-secret settings here. Everything else via `fly secrets set` (DEPLOYMENT.md).
[env]
  APP_ENV = "production"
  PORT = "3000"
  TELEPHONY_MODE = "twilio"
  TWILIO_VALIDATE_SIGNATURES = "true"
  AI_PROVIDER = "anthropic"
  STT_PROVIDER = "deepgram"
  TTS_PROVIDER = "deepgram"
  LOG_LEVEL = "info"

# Replace the single machine in place: the old API must stop (releasing its Postgres
# advisory lock) before the new one starts, or the new one refuses to boot
# (src/database/singleton-lock.ts). In-progress calls drop on deploy; deploy off-hours.
[deploy]
  strategy = "rolling"
  max_unavailable = 1

[http_service]
  processes = ["app"]
  internal_port = 3000
  force_https = true
  # EXACTLY ONE always-on API machine (live call state is in memory; docs/ARCHITECTURE.md).
  # A stopped machine means a missed call, so no auto stop/start.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    # Each active call holds one media WebSocket for up to 30 minutes.
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    method = "GET"
    path = "/ready"
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"

kill_timeout = 30
